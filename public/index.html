<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FaceVault — Photo Library with Face Recognition</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">FaceVault</div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="library">Library</button>
      <button class="tab-btn" data-tab="people">People</button>
    </nav>
    <div class="actions">
      <label class="upload-btn">
        Add Photos
        <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
      </label>
    </div>
  </header>

  <div id="status" class="status hidden"></div>

  <main>
    <section id="library" class="view active">
      <div id="libraryEmpty" class="empty hidden">No photos yet. Click "Add Photos" to build your library.</div>
      <div id="photoGrid" class="grid"></div>
    </section>

    <section id="people" class="view">
      <div id="peopleEmpty" class="empty hidden">No people detected yet. Add some photos with faces in them.</div>
      <div id="peopleGrid" class="grid people-grid"></div>
    </section>

    <section id="personPhotos" class="view">
      <button id="backToPeople" class="back-btn">&larr; Back to People</button>
      <h2 id="personPhotosTitle"></h2>
      <div id="personPhotoGrid" class="grid"></div>
    </section>
  </main>

  <div id="photoModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="closeModal">&times;</button>
      <div class="modal-image-wrap">
        <img id="modalImage" alt="" />
        <svg id="modalOverlay"></svg>
      </div>
      <div id="modalFaces" class="modal-faces"></div>
    </div>
  </div>

  <!-- face-api.js runs entirely client-side: detection + recognition happen
       in the visitor's own browser, nothing is uploaded to any third party. -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
